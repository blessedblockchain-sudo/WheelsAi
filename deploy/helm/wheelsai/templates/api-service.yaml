apiVersion: v1
kind: Service
metadata:
  name: {{ include "wheelsai.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wheelsai.componentLabels" (dict "component" "api" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "wheelsai.selectorLabels" (dict "component" "api" "root" .) | nindent 4 }}
