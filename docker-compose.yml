version: "3.8"

services:
  postgres:
    # pgvector's official image = stock PostgreSQL 15 + the `vector`
    # extension (W2 RAG). Plain postgres:15 cannot CREATE EXTENSION vector,
    # so semantic search has nowhere to store embeddings. Drop-in for the
    # existing data volume — same PG major, same on-disk format.
    image: pgvector/pgvector:pg15
    container_name: wheelsai-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: wheelsai
      POSTGRES_PASSWORD: wheelsai
      POSTGRES_DB: wheelsai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wheelsai -d wheelsai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wheelsai-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
