# Fly.io configuration for WheelsAI API (Production)
# Deploy with: fly deploy --config fly.production.toml

app = "wheelsai-api"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Run migrations once per release, before machines are replaced, so new
  # code never boots against an unmigrated database (B4).
  release_command = "npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma"

[env]
  NODE_ENV = "production"
  API_PORT = "4000"
  API_HOST = "0.0.0.0"
  LOG_LEVEL = "info"
  SOLANA_NETWORK = "mainnet-beta"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  # Readiness, not liveness (H5). /health returns 200 unconditionally, so an
  # instance with an unreachable database stayed in the load balancer serving
  # 500s. /health/ready probes Postgres and Redis and answers 503 when either
  # is gone, which is what actually removes the machine from rotation.
  path = "/health/ready"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2

[metrics]
  port = 4000
  path = "/metrics"
