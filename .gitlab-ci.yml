# GitLab CI — port of .github/workflows/ci.yml
#
# The GitHub pipeline is unreachable while the GitHub account is suspended,
# and GitLab does not read .github/workflows. This file is the working
# pipeline; keep the two in sync until one of them is deleted.
#
# Job graph mirrors the original exactly (build gates on lint+typecheck,
# test/e2e gate on build), expressed with `needs:` so independent jobs still
# run concurrently rather than waiting on a whole stage.
#
# The one substantive difference from GitHub Actions: service containers are
# reachable by ALIAS, not localhost. Postgres is at `postgres:5432` and Redis
# at `redis:6379`, so every DATABASE_URL/REDIS_URL below differs from the
# GitHub file even though nothing else about the step changed.

image: node:22

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - verify
  - build
  - test
  - images
  - quarantine
  - deploy

variables:
  # npm's cache dir, kept inside the project so GitLab can cache it.
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  POSTGRES_USER: wheelsai
  POSTGRES_PASSWORD: wheelsai
  POSTGRES_DB: wheelsai_test
  # Service aliases, not localhost — see the header note.
  DATABASE_URL: "postgresql://wheelsai:wheelsai@postgres:5432/wheelsai_test"
  REDIS_URL: "redis://redis:6379"
  JWT_SECRET: "test-secret-key-for-ci-only-32chars"

# Cache the npm download cache rather than node_modules: `npm ci` deletes
# node_modules on every run anyway, so caching it buys nothing and risks
# serving a stale tree across lockfile changes.
.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
  policy: pull-push

.node_setup: &node_setup
  cache:
    <<: *npm_cache
  before_script:
    - npm ci --prefer-offline --no-audit --fund=false

lint:
  stage: verify
  <<: *node_setup
  script:
    # db:generate first: the type-aware lint rules resolve @prisma/client,
    # which does not exist until the client is generated.
    - npm run db:generate
    - npm run lint

typecheck:
  stage: verify
  <<: *node_setup
  script:
    - npm run db:generate
    - npm run typecheck

# Redesign regressions: native browser dialogs and light-only colour
# classes in apps/web. Plain node, so no install is needed.
ui-gates:
  stage: verify
  script:
    - node scripts/check-web-ui-gates.mjs

build:
  stage: build
  needs: [lint, typecheck, ui-gates]
  <<: *node_setup
  script:
    - npm run db:generate
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - apps/api/dist/
      - apps/web/.next/
      - packages/*/dist/

# The blocking test gate: the API unit suite and the web app's unit tests,
# about a minute, no infra required.
# Deliberately NOT `npm run test` (turbo -> api `test`), which also pulls in
# the integration tier — that tier hangs forever, see `test:integration`.
unit:
  stage: test
  needs: [build]
  <<: *node_setup
  script:
    - npm run db:generate
    - npm run test:unit -w @wheelsai/api
    - npm run test:unit -w @wheelsai/web

# The SDK and CLI suites: blocking, no infra (an injected fetch, and for the
# CLI's command tests an HTTP server on 127.0.0.1 inside the job).
# The SDK is built here rather than taken from the build job's artifacts:
# the CLI imports the compiled SDK (its `exports` point at dist/), and the
# tests must run against the SDK source in this commit, not a cached copy.
sdk-cli:
  stage: test
  needs: [build]
  <<: *node_setup
  script:
    - npm run build -w @wheelsai/sdk
    - npm run test -w @wheelsai/sdk
    - npm run test -w @wheelsai/cli

# Schema/migration integrity. Split out from the unit gate because it is the
# only blocking job that needs a live database.
migrations:
  stage: test
  needs: [build]
  <<: *node_setup
  services:
    - name: pgvector/pgvector:pg15
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  script:
    # GitLab only waits for the service port to open, which Postgres does
    # before it will accept queries. Without this, `migrate diff` intermittently
    # fails with "the database system is starting up".
    - apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
    - |
      for i in $(seq 1 30); do
        pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break
        echo "waiting for postgres ($i/30)"; sleep 2
      done
    # The drift check needs its OWN database, not the app one. `migrate diff`
    # applies the whole migration chain to the shadow DB and does NOT clean up
    # after itself — it leaves all 75 tables behind with no _prisma_migrations
    # row. Pointing it at $DATABASE_URL (as the GitHub workflow did) therefore
    # makes the very next `migrate deploy` die with:
    #   P3005: The database schema is not empty.
    # Verified locally against postgres:15 before this file was committed.
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d postgres -c 'CREATE DATABASE wheelsai_shadow;'
    - npm run db:generate
    # Fails the build when schema.prisma has drifted from the migration chain
    # (e.g. a hand-edited schema with no accompanying migration).
    - >-
      npx prisma migrate diff
      --from-migrations packages/db/prisma/migrations
      --to-schema-datamodel packages/db/prisma/schema.prisma
      --shadow-database-url "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/wheelsai_shadow"
      --exit-code
    - npm run migrate:deploy -w @wheelsai/db

# ---------------------------------------------------------------------------
# Training image (infra/training): the container a fine-tuning job runs on a
# GPU node. Two jobs, neither tied to the Node graph above.
#
# trainer-test is the blocking one: the offline pytest suite on CPU. It
# trains a two-layer random model built inside the job, against an HTTP
# server on 127.0.0.1, with the Hugging Face Hub switched off, so it needs
# no GPU, no credential and no network beyond the pip install. On merge
# requests it only runs when the trainer changed (the install is about
# 200 MB of CPU torch); on the default branch and on tags it always runs,
# because trainer-image needs it.
#
# The pip cache key is the requirement files: a changed pin re-downloads,
# anything else reuses the wheels.
# ---------------------------------------------------------------------------

trainer-test:
  stage: verify
  image: python:3.11-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  cache:
    key:
      files:
        - infra/training/requirements.txt
        - infra/training/requirements-cpu.txt
      prefix: trainer-pip
    paths:
      - .pip-cache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infra/training/**/*
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - cd infra/training
    # torch first and alone, so only torch is taken from the PyTorch index.
    - pip install -r requirements-cpu.txt
    - pip install -r requirements.txt -r requirements-test.txt
    - python -m pytest

# Builds the GPU image, pushes it and prints its digest. MANUAL: nothing is
# published until a person presses the job, and it only appears on the
# default branch or a tag. The digest it prints is what goes into the API's
# TRAINING_IMAGE (always <repository>@sha256:..., never a tag), so the image
# a paid job runs is exactly the one that was built from a tested commit.
#
# Where it pushes:
#   - by default, this project's own GitLab registry
#     ($CI_REGISTRY_IMAGE/trainer) with the job's built-in credentials;
#   - elsewhere (a public project, Docker Hub) when TRAINER_IMAGE_REPOSITORY,
#     TRAINER_REGISTRY, TRAINER_REGISTRY_USER and TRAINER_REGISTRY_PASSWORD
#     are set in Settings > CI/CD > Variables (masked + protected).
# A GPU node pulls without credentials, so the repository has to be public
# or the API has to be given pull credentials; see docs/FOUNDER-ACTIONS.md.
#
# The image is 6.32 GB on disk and 3.27 GB to pull (CUDA runtime plus
# torch), so the job gets its own timeout. This job has never been run. The
# same build was made and published by hand on 2026-10-12 with
# infra/training/scripts/publish-image.sh; infra/training/README.md has the
# figures.
trainer-image:
  stage: images
  needs: [trainer-test]
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  timeout: 45m
  cache: []
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  script:
    - |
      REPOSITORY="${TRAINER_IMAGE_REPOSITORY:-$CI_REGISTRY_IMAGE/trainer}"
      REGISTRY="${TRAINER_REGISTRY:-$CI_REGISTRY}"
      REGISTRY_USER="${TRAINER_REGISTRY_USER:-$CI_REGISTRY_USER}"
      REGISTRY_PASSWORD="${TRAINER_REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
      if [ -z "$REPOSITORY" ] || [ -z "$REGISTRY" ] || [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_PASSWORD" ]; then
        echo "No registry to push to: enable this project's container registry or set the TRAINER_* variables."
        exit 1
      fi
      TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      # --password-stdin keeps the password out of the process list and the log.
      echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
      docker build --pull \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --tag "$REPOSITORY:$TAG" infra/training
      docker push "$REPOSITORY:$TAG"
      DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "$REPOSITORY:$TAG")"
      case "$DIGEST" in
        *@sha256:*) ;;
        *) echo "The push returned no digest"; exit 1 ;;
      esac
      echo "Pushed $REPOSITORY:$TAG"
      echo "TRAINING_IMAGE=$DIGEST"
      echo "TRAINING_IMAGE=$DIGEST" > trainer-image.env
  artifacts:
    expire_in: 90 days
    paths:
      - trainer-image.env

# ---------------------------------------------------------------------------
# Quarantine: tiers that are currently RED. Both are allow_failure so they
# cannot block a merge, but they still run and still report, so the breakage
# stays visible instead of being silently deleted. Move each back into the
# `test` stage (and drop allow_failure) as it goes green.
#
# Neither has ever run in CI — the GitHub pipeline died at the lint job on all
# 65 of its runs, so nothing downstream was ever executed. Both were verified
# locally on 2026-07-29 against postgres:15 + redis:7.
#
# Explicit `timeout:` on both: the integration tier HANGS rather than failing,
# and GitLab's default 1h job timeout would burn the whole free CI allowance
# on a single run.
# ---------------------------------------------------------------------------

# Status: 1 of 3 files passes.
#   - x402.integration.test.ts        hangs after its assertions pass (open
#     handle keeps the event loop alive; the runner never exits)
#   - wallet-auth.integration.test.ts fails outright: it assigns to an ES
#     module export ("Cannot assign to read only property 'generateNonce' of
#     object '[object Module]'"). Needs the patch-the-object approach used in
#     versioningTenancy.unit.test.ts, not module-binding assignment.
#   - nosana.integration.test.ts      passes
test:integration:
  stage: quarantine
  needs: [build]
  allow_failure: true
  timeout: 10m
  <<: *node_setup
  services:
    - name: pgvector/pgvector:pg15
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
    - |
      for i in $(seq 1 30); do
        pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" && break
        echo "waiting for postgres ($i/30)"; sleep 2
      done
    - npm run db:generate
    - npm run migrate:deploy -w @wheelsai/db
    - npm run test:integration -w @wheelsai/api

# ---------------------------------------------------------------------------
# Deploy (B7): port of .github/workflows/deploy-staging.yml. Manual trigger,
# and the jobs only APPEAR when FLY_API_TOKEN exists (Settings > CI/CD >
# Variables, masked+protected) — without the token there is nothing to run.
#
# flyctl runs from the REPO ROOT: the Dockerfiles COPY package.json,
# turbo.json, and packages/ from the monorepo root, so the build context
# must be the root. Migrations run via the release_command in the fly
# tomls — no migration step here.
#
# The web job passes NEXT_PUBLIC_* as --build-arg: Next.js bakes those into
# the browser bundle at BUILD time. The old GitHub workflow deployed web
# without them, which shipped a bundle pointing at http://localhost:4000.
# ---------------------------------------------------------------------------

.fly_deploy: &fly_deploy
  stage: deploy
  needs: [unit, sdk-cli, migrations]
  image: node:22
  cache: []
  before_script:
    - curl -L https://fly.io/install.sh | sh
    - export PATH="$HOME/.fly/bin:$PATH"
    - flyctl version

deploy:staging:api:
  <<: *fly_deploy
  resource_group: deploy-staging-api
  rules:
    - if: '$FLY_API_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - flyctl deploy --config apps/api/fly.staging.toml --dockerfile apps/api/Dockerfile --remote-only
    # Readiness, not liveness: /health/ready probes Postgres + Redis.
    - |
      for i in $(seq 1 12); do
        if curl -fsS --max-time 10 https://wheelsai-api-staging.fly.dev/health/ready; then
          echo "API healthy"; exit 0
        fi
        echo "waiting for API health ($i/12)..."; sleep 10
      done
      echo "API health check failed after deploy"; exit 1

deploy:staging:web:
  <<: *fly_deploy
  resource_group: deploy-staging-web
  rules:
    - if: '$FLY_API_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
  script:
    - >-
      flyctl deploy --config apps/web/fly.staging.toml
      --dockerfile apps/web/Dockerfile --remote-only
      --build-arg NEXT_PUBLIC_API_URL=https://wheelsai-api-staging.fly.dev
      --build-arg NEXT_PUBLIC_APP_URL=https://wheelsai-web-staging.fly.dev
    - |
      for i in $(seq 1 12); do
        if curl -fsS --max-time 10 https://wheelsai-web-staging.fly.dev/api/health; then
          echo "Web healthy"; exit 0
        fi
        echo "waiting for web health ($i/12)..."; sleep 10
      done
      echo "Web health check failed after deploy"; exit 1

# Status: 27 of 30 specs fail. The specs assert literal marketing copy
# ("Welcome back", "you@example.com", section headings) that drifted when the
# theme was unified; they were never run against the current pages. They also
# only ever assert static rendering — no login, no API — so even green they
# would not prove a flow works (see finding I3 in REMEDIATION_PLAN.md).
e2e:
  stage: quarantine
  needs: [build]
  allow_failure: true
  timeout: 15m
  <<: *node_setup
  variables:
    # playwright.config.ts keys off CI: forbids .only, retries twice, and
    # starts its own web server rather than reusing a local one.
    CI: "true"
  script:
    - npm run db:generate
    # Installs the exact browser build this Playwright version pins. Do not
    # swap for a cached/global browser — a mismatched build fails every spec
    # with "Executable doesn't exist".
    - npx playwright install --with-deps chromium
    - npm run test:e2e -w apps/web
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - apps/web/playwright-report/
      - apps/web/test-results/
