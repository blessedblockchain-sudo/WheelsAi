apiVersion: v1
kind: Service
metadata:
  name: wheelsai-api
  namespace: wheelsai
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: wheelsai
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: wheelsai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wheelsai-api
  namespace: wheelsai
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: wheelsai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: wheelsai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: wheelsai
    spec:
      containers:
        - name: api
          image: ghcr.io/wheelsai/api:latest
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: wheelsai-config
            - secretRef:
                name: wheelsai-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
