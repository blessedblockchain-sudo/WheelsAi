apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wheelsai.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wheelsai.componentLabels" (dict "component" "api" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "wheelsai.selectorLabels" (dict "component" "api" "root" .) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "wheelsai.componentLabels" (dict "component" "api" "root" .) | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "wheelsai.fullname" . }}-config
            - secretRef:
                name: {{ include "wheelsai.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.health.path }}
              port: {{ .Values.api.port }}
            initialDelaySeconds: {{ .Values.api.health.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.health.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.api.health.path }}
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 30
