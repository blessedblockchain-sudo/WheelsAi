[toolchain]
anchor_version = "0.32.1"
solana_version = "3.0.0"

[features]
seeds = false
skip-lint = false

[programs.localnet]
agent_treasury = "9TF7xZpYYwbiiVmcJJs6RDmjDTpqoscYtWKhNBcMzM1n"
reputation_oracle = "DMa1sNwXF6mZ2vyGiuA4QZhXPb5Sk4tp9gdnXsscrEB5"

[programs.devnet]
agent_treasury = "9TF7xZpYYwbiiVmcJJs6RDmjDTpqoscYtWKhNBcMzM1n"
reputation_oracle = "DMa1sNwXF6mZ2vyGiuA4QZhXPb5Sk4tp9gdnXsscrEB5"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

# Tests run via plain `cargo test -p agent-treasury` (LiteSVM, no validator).
# Anchor's TS test runner is intentionally NOT wired so the program tests stay
# decoupled from this monorepo's pnpm/turbo conventions.
[scripts]
test = "cargo test --manifest-path programs/agent-treasury/Cargo.toml && cargo test --manifest-path programs/reputation-oracle/Cargo.toml"
