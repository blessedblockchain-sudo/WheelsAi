apiVersion: v1
kind: Service
metadata:
  name: wheelsai-web
  namespace: wheelsai
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: wheelsai
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: wheelsai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wheelsai-web
  namespace: wheelsai
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: wheelsai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: wheelsai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: wheelsai
    spec:
      containers:
        - name: web
          image: ghcr.io/wheelsai/web:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.wheelsai.io"
          resources:
            requests:
              cpu: 125m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      terminationGracePeriodSeconds: 15
