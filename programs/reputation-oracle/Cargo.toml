[package]
name = "reputation-oracle"
version = "0.1.0"
description = "WheelsAI on-chain reputation oracle — attestor-signed agent uptime/score records consumed by the token-launch eligibility gate."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reputation_oracle"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }

[dev-dependencies]
litesvm = "0.7"
solana-sdk = "2.1"
solana-program = "2.1"
borsh = "1.5"
